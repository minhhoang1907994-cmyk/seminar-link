services:
  - type: web
    name: seminar-link-web
    env: ruby
    plan: standard
    disk:
      name: seminar-link-storage
      mountPath: /data
      sizeGB: 10
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: SOLID_QUEUE_IN_PUMA
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: seminar-link-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ACTIVE_STORAGE_ROOT
        value: /data/storage

  - type: worker
    name: seminar-link-worker
    env: ruby
    plan: standard
    disk:
      name: seminar-link-storage
      mountPath: /data
      sizeGB: 10
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:migrate
    startCommand: bundle exec bin/jobs
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: DATABASE_URL
        fromDatabase:
          name: seminar-link-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ACTIVE_STORAGE_ROOT
        value: /data/storage

databases:
  - name: seminar-link-db
    databaseName: seminar_link_production
    plan: starter
